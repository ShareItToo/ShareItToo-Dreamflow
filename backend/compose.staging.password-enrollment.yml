services:
  api:
    environment:
      # Mounting the registry never activates this lane. Activation remains an
      # explicit, separately authorized runtime configuration change.
      SIT_STAGING_PASSWORD_ENROLLMENT_ENABLED: ${SIT_STAGING_PASSWORD_ENROLLMENT_ENABLED:-false}
      SIT_STAGING_PASSWORD_ENROLLMENT_INVITATIONS_FILE: /run/secrets/staging-password-enrollment-registry.json
    volumes:
      - type: bind
        source: ${SIT_STAGING_PASSWORD_ENROLLMENT_REGISTRY_HOST_FILE:?SIT_STAGING_PASSWORD_ENROLLMENT_REGISTRY_HOST_FILE must be set for the password-enrollment overlay}
        target: /run/secrets/staging-password-enrollment-registry.json
        read_only: true
        bind:
          create_host_path: false
